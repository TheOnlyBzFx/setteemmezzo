<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1b1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="7½ FISM">
<title>Sette e Mezzo · FISM</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e1e1e'/><text x='50' y='70' font-size='56' text-anchor='middle' fill='%23e8b84a' font-family='Georgia'>7½</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1e1e1e;--bg2:#171717;--panel:#262626;--line:#3a3a3a;--chalk:#f4f1ea;--red:#e0442f;--green:#5fd39a;--muted:#9a968e;--gold:#e8b84a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%;background:var(--bg);color:var(--chalk);font-family:Inter,system-ui,-apple-system,sans-serif}
body{overflow:hidden;overscroll-behavior:none}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
small{font-weight:400}
.muted{color:var(--muted)}
.hand{font-family:'Patrick Hand',cursive}
.top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) 8px calc(env(safe-area-inset-left) + 10px);background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
.top .title{flex:1;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .title small{color:var(--muted);font-size:13px;margin-left:4px}
.logo{font-family:'Patrick Hand',cursive;font-size:30px;color:var(--gold);line-height:1;padding:0 4px}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.btn{appearance:none;border:1px solid #444;background:#2e2e2e;color:var(--chalk);border-radius:14px;padding:13px 14px;font:600 16px Inter,system-ui,sans-serif;cursor:pointer;touch-action:manipulation;transition:transform .06s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{padding:8px 11px;font-size:14px;border-radius:10px}
.btn.big{width:100%;padding:16px;font-size:18px;margin-top:10px}
.btn[disabled]{opacity:.3;pointer-events:none}
.btn small{display:block;font-size:12px;opacity:.75;margin-top:2px}
.btn.sel{outline:3px solid var(--gold);outline-offset:-3px}
/* home */
.home{padding:14px 14px 40px;max-width:560px;margin:0 auto}
.resume{width:100%;text-align:left;border-color:var(--gold);margin-bottom:4px}
.rankhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:26px 0 8px;flex-wrap:wrap}
.rankhead h2{margin:0;font-size:20px}
.sync{font-size:12px;color:var(--muted)}
ol.rank{list-style:none;margin:0;padding:0}
ol.rank li{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid #2c2c2c;font-size:17px}
ol.rank .pos{width:24px;text-align:right;color:var(--muted);font-size:14px}
ol.rank li:nth-child(1) .pos{color:var(--gold);font-weight:800}
ol.rank .em{width:28px;text-align:center;font-size:20px}
ol.rank .nm{flex:1}
ol.rank .sc{font-family:'Patrick Hand',cursive;font-size:24px}
ol.rank .sub{font-size:13px;color:var(--muted);margin-left:6px}
.pos-c{color:var(--green)}.neg-c{color:var(--red)}
/* setup */
.setup{padding:14px 14px 40px;max-width:560px;margin:0 auto}
.setup h3{margin:18px 0 8px;font-size:16px;color:var(--muted);font-weight:600}
.stepper{display:flex;align-items:center;gap:16px}
.stepper span{font-family:'Patrick Hand',cursive;font-size:36px;min-width:40px;text-align:center}
.stepper .btn{width:52px;height:52px;font-size:24px;padding:0}
.slot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.slot .num{width:22px;color:var(--muted);text-align:right}
select,input{font:16px Inter,system-ui,sans-serif;background:#2b2b2b;color:var(--chalk);border:1px solid #474747;border-radius:12px;padding:12px}
.slot select{flex:1;min-width:0}
.newp{display:flex;gap:8px;width:100%;padding-left:30px}
.newp input{flex:1;min-width:0}
.newp input.emo{flex:none;width:64px;text-align:center}
/* table */
.gbody{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.tw{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;position:relative;background:var(--bg)}
table.sh{border-collapse:separate;border-spacing:0;min-width:100%;font-family:'Patrick Hand',cursive}
.sh th{position:sticky;top:0;z-index:2;background:var(--bg);padding:6px 4px 4px;border-bottom:2px solid var(--chalk);border-left:2px solid var(--chalk);font-weight:400;min-width:70px;text-align:center}
.sh th .pe{font-size:17px;line-height:1.1}
.sh th .pn{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px;margin:0 auto}
.sh td{border-left:2px solid var(--chalk);padding:3px 6px;height:44px;vertical-align:middle}
.sh .n{position:sticky;left:0;z-index:1;background:var(--bg);color:var(--muted);text-align:center;width:30px;min-width:30px;border-left:none;font-size:16px;padding:0;cursor:pointer}
.sh thead .n{z-index:3}
.cell{display:flex;justify-content:space-between;align-items:center;gap:3px;white-space:nowrap}
.bet{font-size:25px;line-height:1}
.bet.m{color:var(--gold)}
.bet.empty{color:#555}
.r{color:var(--red);font-size:17px;position:relative;top:-9px;margin-left:1px}
.run{font-size:16px;color:var(--muted)}
.run.p{color:#a8e6c4}.run.q{color:#f3a597}
td.cur{background:rgba(232,184,74,.16)}
tr.draft td:not(.n){background:rgba(255,255,255,.03)}
tr.cut td{padding:0;height:auto;border-left:none}
.cutbox{position:sticky;left:0;display:flex;align-items:center;gap:10px;border-top:3px solid var(--chalk);margin:2px 0 4px;padding:3px 8px;width:min(100vw,100%);font-family:Inter,sans-serif;font-size:12px;color:var(--muted)}
.cutbox img{height:34px;filter:none}
.sh tfoot td{position:sticky;bottom:0;z-index:1;background:#141414;border-top:2px solid var(--chalk);height:40px;font-size:22px;text-align:center}
.sh tfoot td.n{z-index:3;color:var(--gold);font-size:18px}
.empty-hint{padding:30px 16px;text-align:center;color:var(--muted);font-family:Inter,sans-serif}
/* bottom sheet */
.sheet{flex:none;background:var(--panel);border-top:1px solid #444;border-radius:18px 18px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));max-height:60vh;max-height:60dvh;overflow:auto;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.sheet h3{margin:0 0 10px;font-size:17px;font-weight:600}
.sheet h3 b{font-weight:800}
.sheet h3 small{color:var(--muted);font-size:14px}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.who{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 12px;margin-bottom:10px;color:#141414;background:var(--gold);box-shadow:0 0 0 3px rgba(232,184,74,.25)}
.who.res{background:#7fd9ff;box-shadow:0 0 0 3px rgba(127,217,255,.25)}
.who .wl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.75;line-height:1.1}
.who .we{font-size:32px;line-height:1}
.who .wn{font-size:25px;font-weight:800;line-height:1.1}
.who .wx{margin-left:auto;text-align:right;font-size:13px;font-weight:600;opacity:.8;white-space:nowrap}
.who .wx b{display:block;font-family:'Patrick Hand',cursive;font-size:26px;font-weight:400;opacity:1}
.sh th.cur{background:var(--gold);color:#141414}
.sh th.cur.hl-res,.sh td.cur.hl-res{--hl:#7fd9ff}
.sh th.cur.hl-res{background:#7fd9ff}
td.cur{background:rgba(232,184,74,.22)!important;box-shadow:inset 0 0 0 3px var(--hl,var(--gold));animation:pulse 1.2s ease-in-out infinite}
td.cur.hl-res{background:rgba(127,217,255,.18)!important}
@keyframes pulse{50%{box-shadow:inset 0 0 0 1px var(--hl,var(--gold))}}
.sh tbody td:not(.n){cursor:pointer}
.sh.compact th{min-width:0;padding:5px 2px 3px}
.sh.compact th .pn{font-size:15px;max-width:62px}
.sh.compact th .pe{font-size:15px}
.sh.compact td{padding:2px 3px;height:40px}
.sh.compact .bet{font-size:21px}
.sh.compact .r{font-size:13px;top:-7px}
.sh.compact .run{font-size:13px}
.sh.compact .cell{flex-direction:column;align-items:flex-start;gap:0}
.sh.compact .cell .run{align-self:flex-end;line-height:1}
.sh.compact tfoot td{font-size:18px}
.sh.compact .n{width:22px;min-width:22px;font-size:13px}
.tap-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.btnrow2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn.wa{background:#25d366;border-color:#25d366;color:#0b2e17}
.load{padding:14px 14px 120px;max-width:560px;margin:0 auto}
.lrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #2c2c2c}
.lrow .em{width:28px;text-align:center;font-size:20px}
.lrow .nm{flex:1;font-size:16px}
.lrow .sg{width:44px;height:44px;padding:0;font-size:22px;border-radius:12px}
.lrow .sg.p{color:var(--green);border-color:#2f6b4c}
.lrow .sg.m{color:var(--red);border-color:#7a2e24}
.lrow input{width:96px;text-align:right;font-family:'Patrick Hand',cursive;font-size:22px;padding:8px 10px}
.loadbar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid #444;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px}
.loadbar .sum{flex:1;font-size:15px}
textarea{width:100%;min-height:300px;font:16px/1.45 Inter,system-ui,sans-serif;background:#2b2b2b;color:var(--chalk);border:1px solid #474747;border-radius:12px;padding:12px;resize:vertical}
.chg{font-size:13px;margin-left:6px}
.prog{color:var(--muted);font-size:13px;padding-top:3px}
.grid{display:grid;gap:8px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.bigbtn{font-family:'Patrick Hand',cursive;font-size:30px;padding:10px 0}
.bigbtn.dealer{font-family:Inter,sans-serif;font-size:15px;color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.res{font-size:16px;padding:12px 8px}
.res.win{border-color:#2f6b4c;background:#21342a}
.res.lose{border-color:#7a2e24;background:#3a2320}
.res.piste{width:100%;margin-top:8px;border-color:#5b5130;background:#332e1f}
.glob{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #383838}
.glob .lbl{font-size:12px;color:var(--muted);width:100%}
.list{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.li{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#2e2e2e;border:1px solid #3d3d3d;color:var(--chalk);border-radius:12px;padding:10px 12px;font:16px Inter,sans-serif;cursor:pointer}
.li span:first-child{flex:1}
.li b{font-family:'Patrick Hand',cursive;font-size:22px;font-weight:400}
.li .ed{opacity:.5;font-size:13px}
.li.pr{cursor:default;gap:6px;padding:6px 8px 6px 12px}
.li.pr .pn2{flex:1;cursor:pointer;min-width:0}
.li.pr .tot{flex:none;min-width:64px;text-align:center;font-size:24px}
.li.pr .cnt{display:flex;align-items:center;gap:4px;flex:none}
.li.pr .cnt .btn{width:40px;height:40px;padding:0;font-size:22px;border-radius:10px}
.li.pr .cv{display:flex;flex-direction:column;align-items:center;min-width:34px;line-height:1}
.li.pr .cv b{font-size:24px}
.li.pr .cv small{font-size:10px;color:var(--muted)}
.sc4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.sc4 .btn{padding:11px 8px;font-size:15px;line-height:1.2}
.btn.allwin{background:#1d8a50;border-color:#34c27a;color:#fff}
.btn.alllose{background:#a52a1c;border-color:#e04a35;color:#fff}
.legend{font-size:11px;color:var(--muted);text-align:center;margin:2px 0 8px}
.rlist{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.rrow{background:#2e2e2e;border:2px solid #3d3d3d;border-radius:12px;padding:7px 9px}
.rrow.won{border-color:#2fa866;background:#1f3328}
.rrow.lost{border-color:#d0402c;background:#3a2320}
.rrow.flash{animation:flash 1s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 4px var(--gold)}}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:6px}
.rn{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt{font-family:'Patrick Hand',cursive;font-size:27px;font-weight:400;line-height:1}
.rbot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
.seg{display:inline-flex;border:1px solid #555;border-radius:10px;overflow:hidden;flex:none}
.seg button{background:#262626;color:var(--chalk);border:none;padding:10px 9px;font:600 14px Inter,sans-serif;cursor:pointer;touch-action:manipulation}
.seg button+button{border-left:1px solid #555}
.seg button.on{background:var(--gold);color:#141414}
.seg button.on.win{background:#2fa866;color:#fff}
.seg button.on.lose{background:#d0402c;color:#fff}
.seg.mult button{padding:10px 7px}
.cnt{display:flex;align-items:center;gap:3px;flex:none}
.cnt .btn{width:38px;height:38px;padding:0;font-size:21px;border-radius:10px}
.cv{display:flex;flex-direction:column;align-items:center;min-width:30px;line-height:1}
.cv b{font-family:'Patrick Hand',cursive;font-size:24px;font-weight:400}
.cv small{font-size:10px;color:var(--muted)}
.hcard{display:block;width:100%;text-align:left;background:#2a2a2a;border:1px solid #3d3d3d;border-radius:14px;padding:11px 13px;margin-bottom:8px;color:var(--chalk);font:15px Inter,sans-serif;cursor:pointer}
.hcard .hd{font-weight:700;display:flex;justify-content:space-between;gap:8px}
.hcard .hd small{color:var(--muted);font-weight:400}
.hcard .hp{margin-top:6px;font-size:14px;line-height:1.6;color:#d8d3ca}
.hcard .hp span{white-space:nowrap;margin-right:10px}
.scs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.scb{appearance:none;background:transparent;border:1.5px solid;border-radius:10px;padding:7px 3px;font:700 12px/1.15 Inter,sans-serif;cursor:pointer;touch-action:manipulation}
.scb.win{border-color:#34c27a;color:#5fd39a}
.scb.lose{border-color:#e04a35;color:#ff8a78}
.scb.win.on{background:#1d8a50;color:#fff}
.scb.lose.on{background:#c0341f;color:#fff}
.rlist2{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.prow{display:flex;align-items:center;gap:8px;background:#2e2e2e;border:2px solid #3d3d3d;border-radius:14px;padding:8px 8px 8px 12px}
.prow.won{border-color:#2fa866;background:#1f3328}
.prow.lost{border-color:#d0402c;background:#3a2320}
.prow.flash{animation:flash 1s ease 2}
.pnm{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.pe2{font-size:26px;line-height:1}
.pnm b{display:block;font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnm small{display:block;font-size:12px;color:var(--muted)}
.pval{font-family:'Patrick Hand',cursive;font-size:30px;font-weight:400;min-width:62px;text-align:right}
.cnt.big .btn{width:46px;height:46px;font-size:26px}
.cnt.big .cv{min-width:38px}
.cnt.big .cv b{font-size:26px}
.gtot{display:flex;flex-wrap:wrap;gap:6px 12px;background:#141414;border:1px solid #333;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.gtot span{white-space:nowrap}
.gcard{background:#262626;border:1px solid #3a3a3a;border-radius:14px;padding:10px 12px;margin-bottom:10px}
.gcard.cur{border-color:var(--gold)}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.gh b{font-size:17px}
.gh span{font-size:13px;color:var(--muted)}
table.gt{width:100%;border-collapse:collapse;font-size:15px}
table.gt td{padding:5px 4px;border-top:1px solid #333}
table.gt td.v{font-family:'Patrick Hand',cursive;font-size:21px;text-align:right;white-space:nowrap}
table.gt td.b{color:var(--muted);text-align:center;white-space:nowrap}
table.gt td.e{color:var(--red);text-align:center;font-family:'Patrick Hand',cursive;font-size:18px}
table.gt tr.dl td{color:var(--gold)}
.gcut{display:flex;align-items:center;gap:8px;margin:4px 0 14px;color:var(--muted);font-size:13px}
.gcut:before,.gcut:after{content:'';flex:1;border-top:3px solid var(--chalk)}
.paybox{background:linear-gradient(135deg,#3b2f10,#2a2210);border:2px solid var(--gold);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.paybox .pt{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.paybox .pw{font-size:17px;margin:6px 0 10px;line-height:1.4}
.paybox .btn{width:100%}
.gasbox{background:#1a1a19;border:1px solid #333;border-radius:16px;padding:10px 12px 12px;margin:10px 0;text-align:center}
.gasbox svg{width:100%;max-width:340px;display:block;margin:0 auto}
.gasbox .gl{font-size:20px;font-weight:800;margin-top:-4px}
.gasbox .gs{font-size:13px;color:var(--muted)}
.mgas{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.mgas .bar{flex:1;height:6px;border-radius:3px;background:#3a3a3a;overflow:hidden}
.mgas .bar i{display:block;height:100%;border-radius:3px}
.chartbox{position:relative;background:#1a1a19;border:1px solid #333;border-radius:16px;padding:8px 6px 4px;margin-bottom:10px}
.chartbox svg{width:100%;height:auto;display:block;touch-action:pan-y}
.chartbox .tip{position:absolute;top:8px;pointer-events:none;background:rgba(10,10,10,.92);border:1px solid #444;border-radius:10px;padding:6px 9px;font-size:12px;line-height:1.5;display:none;white-space:nowrap;z-index:2}
.chartbox .tip b{font-family:'Patrick Hand',cursive;font-size:16px;font-weight:400}
.seg2{display:flex;border:1px solid #555;border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg2 button{flex:1;background:#262626;color:var(--chalk);border:none;padding:9px 6px;font:600 13px Inter,sans-serif;cursor:pointer}
.seg2 button.on{background:var(--gold);color:#141414}
.grafwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.grafchart{flex:2 1 320px;min-width:0}
.grafgas{flex:1 1 240px;min-width:220px}
.lgd{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.lgd button{display:flex;align-items:center;gap:6px;background:#262626;border:1px solid #3d3d3d;border-radius:20px;padding:5px 10px 5px 7px;color:var(--chalk);font:13px Inter,sans-serif;cursor:pointer}
.lgd button.off{opacity:.45}
.lgd i{width:12px;height:12px;border-radius:50%;flex:none}
.lgd b{font-family:'Patrick Hand',cursive;font-size:16px;font-weight:400}
.li.dealer{border-color:#6b5a2a;background:#2f2a1d;cursor:default}
.warn{background:#3a2320;border:1px solid #7a2e24;color:#ffb4a8;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.ok{background:#1f3328;border:1px solid #2f6b4c;color:#a8e6c4;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.pst{display:flex;align-items:center;gap:12px;margin:8px 0}
.pst span{flex:1}
.pst b{font-family:'Patrick Hand',cursive;font-size:34px;min-width:36px;text-align:center;font-weight:400}

/* ===== IPAD E COMPUTER IN ORIZZONTALE: tabella a sinistra, pannello a destra ===== */

    padding:16px calc(env(safe-area-inset-right) + 16px) calc(16px + env(safe-area-inset-bottom)) 16px}
  .sh th{min-width:84px}

  .sh.compact .bet{font-size:25px}.sh.compact .cell{flex-direction:row;align-items:center}
}
/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
#modal.on{display:flex}
.mbox{background:var(--panel);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;max-height:90dvh;overflow:auto}

table.mz{border-collapse:collapse;width:100%;font-size:14px;margin:4px 0}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:.92}
</style>

<body>
<div id="app"></div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>
<script>
/* =========================================================
   CONFIGURAZIONE
   DB_URL = indirizzo del database condiviso (Firebase Realtime Database).
   Se è vuoto la classifica viene salvata solo sul telefono.
   ========================================================= */
const DB_URL = 'https://setteemmezzo-fism-default-rtdb.europe-west1.firebasedatabase.app';

const SEED = [
  ['Kiuppa','🍑',320],['Capitano','👨‍✈️',-480],['Giugi','🏳️',-70],['Luga','🧞‍♂️',410],
  ['Meme','🐗',-1550],['Tia','🐦‍⬛',980],['Biondo','👨‍🦼‍➡️',1100],['Bazoo','🥁',-1710],
  ['Espodelpoli','🏇',-900],['Pino','🌲',-20],['LucaMoro','🐲',190],['Bebote','🍼',100],
  ['Fangus','🍄‍🟫',800],['Dessy','🍩',390],['Dani','🐌',420],['Fofana','💪🏻',-290],['Zac','🥖',310]
];

/* ---------- utility ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n);
const sgn = n => n > 0 ? 'pos-c' : n < 0 ? 'neg-c' : '';
const slug = n => (n || '').toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g, '') || ('p' + Date.now().toString(36));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function seedObj() { const g = {}; SEED.forEach(([n, e, b], i) => g[slug(n)] = { name: n, emoji: e, base: b, order: i }); return g; }

/* ---------- database (Firebase REST oppure locale) ---------- */
function localGet(path) { let o = LS.get('sem_localdb', {}); for (const k of path.split('/').filter(Boolean)) o = o == null ? null : o[k]; return o ?? null; }
function localPut(path, val) {
  const root = LS.get('sem_localdb', {}); const ks = path.split('/').filter(Boolean); let o = root;
  ks.slice(0, -1).forEach(k => { if (!o[k] || typeof o[k] !== 'object') o[k] = {}; o = o[k]; });
  o[ks[ks.length - 1]] = val; LS.set('sem_localdb', root);
}
async function dbGet(path) {
  if (!DB_URL) return localGet(path);
  const r = await fetch(`${DB_URL}/${path}.json`, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function dbPut(path, val) {
  if (!DB_URL) { localPut(path, val); return; }
  const r = await fetch(`${DB_URL}/${path}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(val) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
}

let REG = LS.get('sem_cache', null);   // {giocatori:{id:{name,emoji,base,order}}, sessioni:{id:{date,deltas,...}}}
let SYNC = 'loading';
async function loadReg() {
  try {
    const data = (await dbGet('')) || {};
    if (!data.giocatori) { data.giocatori = seedObj(); await dbPut('giocatori', data.giocatori); }
    REG = { giocatori: data.giocatori, sessioni: data.sessioni || {} };
    LS.set('sem_cache', REG);
    SYNC = DB_URL ? 'cloud' : 'local';
  } catch (e) {
    SYNC = 'offline';
    if (!REG) REG = { giocatori: seedObj(), sessioni: {} };
  }
  await flushPending();
  render();
}
let flushing = false;
async function flushPending() {
  if (flushing) return; flushing = true;
  const pend = LS.get('sem_pending', []);
  try {
    while (pend.length) {
      const p = pend[0];
      for (const [id, pl] of Object.entries(p.nuovi || {})) {
        const ex = await dbGet('giocatori/' + id);
        if (!ex) await dbPut('giocatori/' + id, pl);
        if (REG && !REG.giocatori[id]) REG.giocatori[id] = ex || pl;
      }
      if (p.del) { await dbPut('sessioni/' + p.id, null); if (REG) delete REG.sessioni[p.id]; }
      else {
        const { nuovi, ...rec } = p;
        await dbPut('sessioni/' + p.id, rec);   // id fisso: riprovare non crea doppioni
        if (REG) REG.sessioni[p.id] = rec;
      }
      pend.shift(); LS.set('sem_pending', pend); LS.set('sem_cache', REG);
    }
    if (SYNC === 'offline') SYNC = DB_URL ? 'cloud' : 'local';
  } catch (e) { SYNC = 'offline'; }
  flushing = false;
}
function allPlayers() {
  const g = { ...(REG?.giocatori || {}) };
  LS.get('sem_pending', []).forEach(p => Object.entries(p.nuovi || {}).forEach(([id, pl]) => { if (!g[id]) g[id] = pl; }));
  return g;
}
function ranking() {
  const g = allPlayers(); const sc = {};
  for (const id in g) sc[id] = +g[id].base || 0;
  const all = { ...(REG?.sessioni || {}) };
  LS.get('sem_pending', []).forEach(p => { if (p.del) delete all[p.id]; else all[p.id] = p; });
  for (const s of Object.values(all)) for (const id in (s.deltas || {})) sc[id] = (sc[id] || 0) + (+s.deltas[id] || 0);
  return Object.keys(g).map(id => ({ id, name: g[id].name, emoji: g[id].emoji, score: sc[id] || 0 }))
    .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
}

/* ---------- regole / calcoli ---------- */
// esiti: W vinto, L perso, W2 d'emblée, W3 triplée, L2 paga x2, L3 paga x3, P piste (w vinte, l perse)
function rDelta(b, r) {
  if (!r || typeof b !== 'number') return 0;
  switch (r.k) {
    case 'N': return b * (r.n || 0);
    case 'W': case 'L': return (r.k === 'W' ? 1 : -1) * b * (r.m || 1) * (r.p ?? 1);
    case 'W2': return 2 * b; case 'W3': return 3 * b;
    case 'L2': return -2 * b * (r.p ?? 1); case 'L3': return -3 * b * (r.p ?? 1);
    case 'P': return ((r.w || 0) - (r.l || 0)) * b;
  }
  return 0;
}
function rLabel(r) {
  if (!r || !r.k) return '';
  if (r.k === 'N') { const n = r.n || 0; return n === 0 ? '0' : n === 1 ? '+' : n === -1 ? '−' : (n > 0 ? '+×' : '−×') + Math.abs(n); }
  if (r.k === 'W' || r.k === 'L') {
    let t = r.k === 'W' ? '+' : '−';
    if ((r.m || 1) > 1) t += '×' + r.m;
    if ((r.p ?? 1) !== 1) t += '·' + (r.p ?? 1) + 'P';
    return t;
  }
  if ((r.k === 'L2' || r.k === 'L3') && r.p > 1) return `${r.k === 'L2' ? '−×2' : '−×3'}·${r.p}P`;
  return { W: '+', L: '−', W2: '×2', W3: '×3', L2: '−×2', L3: '−×3' }[r.k] || `P${r.w}/${r.l}`;
}
function pDelta(h, i) {
  const b = h.bets[i];
  if (b === 'M') { let s = 0; G.players.forEach((_, j) => { if (j !== i && h.bets[j] !== 'M') s += rDelta(h.bets[j], h.res[j]); }); return -s; }
  return rDelta(b, h.res[i]);
}
const dealerOf = h => G.players.findIndex((_, i) => h.bets[i] === 'M');
// ordine di gioco: si parte dal giocatore a destra del mazziere (colonna dopo) e si gira
function playOrder(bets) {
  const n = G.players.length, d = G.players.findIndex((_, k) => bets[k] === 'M');
  if (d < 0) return [...Array(n).keys()];
  return Array.from({ length: n - 1 }, (_, k) => (d + 1 + k) % n);
}
const nonDealers = h => playOrder(h.bets);
function totals() { return G.players.map((_, i) => G.hands.reduce((s, h) => s + (h.stage === 'done' ? pDelta(h, i) : 0), 0)); }

/* ---------- stato ---------- */
let G = LS.get('sem_game', null);   // partita in corso
const S = { view: G ? (G.ended ? 'summary' : 'game') : 'home', setup: null };
function commit() { if (G) LS.set(G.editOf ? 'sem_edit' : 'sem_game', G); render(); }

/* ---------- modali / toast ---------- */
function modal(html) { $('#mbox').innerHTML = html; $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); }
let _cfm = null;
function confirmModal(title, html, ok, fn, danger = true) {
  _cfm = fn;
  modal(`<h3>${title}</h3><p>${html}</p>
    <button class="btn ${danger ? 'red' : 'primary'}" onclick="closeModal();_cfm&&_cfm()">${ok}</button>
    <button class="btn ghost" onclick="closeModal()">Annulla</button>`);
}
let _tt;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('on'), 2200); }

/* ---------- render ---------- */
function render() {
  const a = $('#app');
  if (S.view === 'home') a.innerHTML = homeHTML();
  else if (S.view === 'setup') a.innerHTML = setupHTML();
  else if (S.view === 'game' && G) { a.innerHTML = gameHTML(); afterGameRender(); }
  else if (S.view === 'summary' && G) a.innerHTML = summaryHTML();
  else if (S.view === 'giocate' && G) { a.innerHTML = giocHTML(); const sc = $('#gsc'); if (sc) sc.scrollTop = sc.scrollHeight; }
  else if (S.view === 'load') { a.innerHTML = loadHTML(); updLoadSum(); }
  else if (S.view === 'loaded') a.innerHTML = loadedHTML();
  else if (S.view === 'msg') a.innerHTML = msgHTML();
  else if (S.view === 'hist') a.innerHTML = histHTML();
  else if (S.view === 'graf') { a.innerHTML = grafHTML(); afterGraf(); }
  else if (S.view === 'histNum') { a.innerHTML = histNumHTML(); updHistSum(); }
  else if (S.view === 'msgdone') a.innerHTML = msgDoneHTML();
  else { S.view = 'home'; a.innerHTML = homeHTML(); }
}
function goHome() { S.view = 'home'; S.toGioc = false; render(); }
function resume() { S.view = G.ended ? 'summary' : 'game'; render(); }

/* ===== HOME ===== */
function homeHTML() {
  const r = ranking();
  const syncTxt = { cloud: '☁️ Classifica condivisa', local: '📱 Salvata su questo telefono', offline: '⚠️ Offline: ultima copia salvata', loading: '⏳ Carico la classifica…' }[SYNC];
  const pend = LS.get('sem_pending', []).length;
  return `<header class="top"><div class="logo">7½</div><div class="title">Sette e Mezzo <small>FISM</small></div></header>
  <div class="scroll"><div class="home">
    ${payBanner()}
    ${G && !G.ended ? `<button class="btn resume" onclick="resume()">▶ Riprendi la partita in corso
      <small>${G.type === 'fism' ? '🏆 Ufficiale FISM' : '🤙 A cazz de cane'} · ${G.players.length} giocatori · mano ${G.hands.length}</small></button>` : ''}
    <button class="btn primary big" onclick="askType()">🃏 Nuova partita</button>
    <button class="btn big" onclick="startLoad()">📝 Carica risultati<small>conti già fatti sul foglio → classifica FISM</small></button>
    <button class="btn big" onclick="startMsg()">📋 Aggiorna da messaggio WhatsApp<small>incolla la classifica del gruppo → database</small></button>
    <div class="rankhead"><h2>🏆 Classifica FISM</h2><span class="sync">${syncTxt}${pend ? ` · ${pend} sessione da inviare` : ''}</span></div>
    <button class="btn sm wa" onclick="shareRanking()">📲 Condividi la classifica su WhatsApp</button>
    <ol class="rank">${r.map((p, i) => `<li><span class="pos">${i + 1}</span><span class="em">${esc(p.emoji)}</span><span class="nm">${esc(p.name)}</span><span class="sc ${sgn(p.score)}">${fmt(p.score)}</span></li>`).join('')}</ol>
    <button class="btn big" style="margin-top:16px" onclick="openHistList()">📜 Storico partite<small>tutte le partite salvate · grafico · modifica</small></button>
  </div></div>`;
}
function askType() {
  if (G && !G.ended) {
    confirmModal('C’è una partita in corso', 'Se ne inizi una nuova, quella in corso viene cancellata.', 'Cancella e ricomincia', () => { G = null; LS.del('sem_game'); askType(); });
    return;
  }
  modal(`<h3>Che partita è?</h3>
    <button class="btn choice" onclick="startSetup('fism')"><b>🏆 Partita Ufficiale FISM</b><small>Conta per il torneo: a fine sessione aggiorna la classifica</small></button>
    <button class="btn choice" onclick="startSetup('ccdc')"><b>🤙 A cazz de cane</b><small>Solo per giocare: alla fine non salva niente</small></button>
    <button class="btn ghost" onclick="closeModal()">Annulla</button>`);
}

/* ===== SETUP ===== */
function startSetup(type) {
  closeModal(); if (G && G.ended) { G = null; LS.del('sem_game'); }
  S.setup = { type, n: 5, slots: Array.from({ length: 5 }, () => ({ sel: '', name: '', emoji: '' })) };
  S.view = 'setup'; render();
}
function regList() { const g = allPlayers(); return Object.keys(g).map(id => ({ id, ...g[id] })).sort((a, b) => a.name.localeCompare(b.name)); }
function setupHTML() {
  const st = S.setup, pl = regList();
  const used = new Set(st.slots.map(s => s.sel).filter(v => v && v !== '__new'));
  return `<header class="top"><button class="btn sm ghost" onclick="goHome()">←</button><div class="title">${st.type === 'fism' ? '🏆 Partita Ufficiale FISM' : '🤙 A cazz de cane'}</div></header>
  <div class="scroll"><div class="setup">
    <h3>Quanti giocatori? <small>(da 2 a 6)</small></h3>
    <div class="stepper"><button class="btn" onclick="setN(-1)">−</button><span>${st.n}</span><button class="btn" onclick="setN(1)">+</button></div>
    <h3>Giocatori in ordine</h3>
    ${st.slots.map((s, i) => `<div class="slot"><span class="num">${i + 1}</span>
      <select onchange="setSlot(${i},this.value)"><option value="">— scegli —</option>
        ${pl.map(p => `<option value="${esc(p.id)}" ${s.sel === p.id ? 'selected' : ''} ${used.has(p.id) && s.sel !== p.id ? 'disabled' : ''}>${esc(p.emoji)} ${esc(p.name)}</option>`).join('')}
        <option value="__new" ${s.sel === '__new' ? 'selected' : ''}>➕ Nuovo giocatore…</option>
      </select>
      ${s.sel === '__new' ? `<div class="newp"><input placeholder="Nome" value="${esc(s.name)}" oninput="S.setup.slots[${i}].name=this.value"><input class="emo" placeholder="🙂" value="${esc(s.emoji)}" oninput="S.setup.slots[${i}].emoji=this.value"></div>` : ''}
    </div>`).join('')}
    <button class="btn primary big" onclick="startGame()">Inizia la partita ▶</button>
  </div></div>`;
}
function setN(d) {
  const st = S.setup; st.n = Math.max(2, Math.min(6, st.n + d));
  while (st.slots.length < st.n) st.slots.push({ sel: '', name: '', emoji: '' });
  st.slots.length = st.n; render();
}
function setSlot(i, v) { S.setup.slots[i].sel = v; render(); }
function startGame() {
  const st = S.setup, g = allPlayers(), players = [], seen = new Set();
  for (let i = 0; i < st.slots.length; i++) {
    const s = st.slots[i];
    if (!s.sel) return toast(`Scegli il giocatore n° ${i + 1}`);
    let p;
    if (s.sel === '__new') {
      const name = s.name.trim();
      if (!name) return toast(`Scrivi il nome del giocatore n° ${i + 1}`);
      const id = slug(name);
      p = g[id] ? { id, name: g[id].name, emoji: g[id].emoji, isNew: false } : { id, name, emoji: s.emoji.trim() || '🃏', isNew: true };
    } else p = { id: s.sel, name: g[s.sel].name, emoji: g[s.sel].emoji, isNew: false };
    if (seen.has(p.id)) return toast(`${p.name} è stato scelto due volte`);
    seen.add(p.id); players.push(p);
  }
  G = { id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), type: st.type, players, started: Date.now(),
        hands: [{ bets: {}, res: {}, stage: 'bets' }], cuts: {}, w: { mode: 'bets', idx: 0, i: 0, draft: {}, review: false } };
  S.view = 'game'; commit();
}

/* ===== PARTITA ===== */
function gameHTML() {
  if (G.editOf) return `<header class="top"><button class="btn sm ghost" onclick="exitHist()">←</button>
    <div class="title">📜 Storico<small>${esc(dstr(G.orig.date))}</small></div>
    <button class="btn sm primary" onclick="saveHist()">💾 SALVA</button></header>
  <div class="gbody"><div class="tw" id="tw">${tableHTML()}</div>
  <div class="sheet ${S.sheetMin ? 'min' : ''}" id="sheet"><button class="sheet-toggle" onclick="toggleSheet()">${S.sheetMin ? '▲ Riapri il pannello' : '▼ Guarda la tabella'}</button>${sheetHTML()}</div></div>`;
  return `<header class="top"><button class="btn sm ghost" onclick="goHome()">←</button>
    <div class="title">Mano ${G.w.idx + 1}<small>${G.type === 'fism' ? '🏆 FISM' : '🤙 a cazz de cane'}</small></div>
    <button class="btn sm" onclick="openGioc()">📜 Giocate</button>
    <button class="btn sm red" onclick="askEnd()">FINE SESSIONE</button></header>
  <div class="gbody"><div class="tw" id="tw">${tableHTML()}</div>
  <div class="sheet ${S.sheetMin ? 'min' : ''}" id="sheet"><button class="sheet-toggle" onclick="toggleSheet()">${S.sheetMin ? '▲ Riapri ' + ({ bets: 'le puntate', res: 'i risultati' }[G.w.mode] || 'il pannello') : '▼ Guarda la tabella'}</button>${sheetHTML()}</div></div>`;
}
function viewHand(idx) {

const pn = i => `${esc(G.players[i].emoji)} ${esc(G.players[i].name)}`;

/* --- 1. puntate --- */
function betsSheet() {
  const w = G.w, P = G.players;
  if (!w.review && !w.single && !Object.values(w.draft).includes('M')) {
    // primo passo del mazzo: si sceglie il mazziere

  }

    const order = playOrder(w.draft), pos = order.indexOf(i);
    const first = betStep(-1, 1) === i;
    const onlyDealer = Object.keys(w.draft).every(k => w.draft[k] === 'M');
    return `${dealerTaken && !w.single ? `<div class="glob"><span class="lbl">🃏 Mazziere: <b>${pn(dIdx)}</b> · resta lui fino alla matta</span></div>` : ''}
      <div class="who"><span class="we">${esc(P[i].emoji)}</span><span><div class="wl">🎯 Puntata di</div><div class="wn">${esc(P[i].name)}</div></span><span class="wx">mano ${w.idx + 1}<b>${pos >= 0 ? `${pos + 1}/${order.length}` : ''}</b></span></div>
      <div class="grid g3">${[10, 20, 30, 40, 50].map(v => `<button class="btn bigbtn ${w.draft[i] === v ? 'sel' : ''}" onclick="pickBet(${v})">${v}</button>`).join('')}
        <button class="btn bigbtn dealer ${w.draft[i] === 'M' ? 'sel' : ''}" ${dealerTaken ? 'disabled' : ''} onclick="pickBet('M')">🃏 Mazziere</button></div>
      <div class="row">
        ${!first && !w.single ? `<button class="btn sm ghost" onclick="betNav(-1)">◀ Indietro</button>` : ''}
        ${w.single ? `<button class="btn sm ghost" onclick="toReview()">${backLabel()}</button>` : ''}
        ${first && !w.single && prev && prev.stage === 'done' && !G.cuts[w.idx - 1] && onlyDealer && dealerOf(prev) === (dealerTaken ? dIdx : dealerOf(prev)) ? `<button class="btn sm" onclick="copyPrevBets()">↺ Stesse puntate della mano ${w.idx}</button>` : ''}
        ${dealerTaken && !w.single && !w.ret ? `<button class="btn sm ghost" onclick="changeDealer()">🃏 Cambia mazziere</button>` : ''}
        ${cancelBtn()}
      </div>`;
  }
  const dealers = P.map((_, i) => i).filter(i => w.draft[i] === 'M');
  const rOrder = dealers.length === 1 ? [dealers[0], ...playOrder(w.draft)] : P.map((_, i) => i);
  const missing = P.some((_, i) => w.draft[i] === undefined);
  const err = missing ? 'Manca qualche puntata' : dealers.length !== 1 ? (dealers.length ? 'C’è più di un mazziere' : 'Manca il mazziere: toccane uno e scegli 🃏 Mazziere') : '';
  return `<h3>Controlla le puntate · mano ${w.idx + 1}</h3>
    <div class="list">${rOrder.map(i => `<button class="li" onclick="editBet(${i})"><span>${pn(i)}</span><b>${w.draft[i] === undefined ? '—' : w.draft[i] === 'M' ? '🃏 Mazziere' : w.draft[i]}</b><span class="ed">✏️</span></button>`).join('')}</div>
    ${err ? `<div class="warn">${err}</div>` : ''}
    <button class="btn primary big" ${err ? 'disabled' : ''} onclick="confirmBets()">✓ Conferma puntate</button>
    <div class="row">${cancelBtn()}</div>`;
}
function pickBet(v) {
  const w = G.w;
  if (v === 'M') for (const k in w.draft) if (w.draft[k] === 'M') delete w.draft[k];
  w.draft[w.i] = v;
  const nx = betStep(w.i, 1);
  if (w.single && w.back != null) { w.single = false; w.i = w.back; w.back = null; }
  else if (w.single || nx < 0) { w.single = false; w.review = true; } else w.i = nx;
  commit();
}
// prossimo/precedente giocatore che deve puntare (salta il mazziere già scelto)
function betStep(from, dir) {
  const seq = playOrder(G.w.draft);
  if (from < 0) return dir > 0 ? (seq[0] ?? -1) : -1;
  const pos = seq.indexOf(from);
  if (pos < 0) return dir > 0 ? (seq[0] ?? -1) : -1;
  return seq[pos + dir] ?? -1;
}
function pickDealer(d) {
  const w = G.w;
  for (const k in w.draft) if (w.draft[k] === 'M') delete w.draft[k];
  w.draft[d] = 'M'; w.i = betStep(-1, 1); w.review = false;
  commit();
}
function changeDealer() {
  const w = G.w;
  for (const k in w.draft) if (w.draft[k] === 'M') delete w.draft[k];
  commit();
}
function betNav(d) { const k = betStep(G.w.i, d); if (k >= 0) G.w.i = k; commit(); }
function editBet(i) { Object.assign(G.w, { i, single: true, review: false }); commit(); }
function toReview() {

  else Object.assign(w, { single: false, review: true, piste: null });

}

function confirmBets() {
  const w = G.w, h = G.hands[w.idx];
  h.bets = { ...w.draft };
  if (h.stage === 'done') {      // modifica di una mano già chiusa: ricontrolla gli esiti
    const d = normDraft(h.res, h.bets); G.players.forEach((_, i) => { if (h.bets[i] === 'M') delete d[i]; });
    G.w = { mode: 'res', idx: w.idx, draft: d, ret: w.ret };

function cancelEdit() { if (G.w.ret) { G.w = G.w.ret; backGioc(); commit(); } }

/* --- 2. mano in gioco --- */

/* --- 3. risultati: nomi grandi + contatore (puntata × contatore) --- */
// converte qualsiasi esito (anche dei vecchi formati) nel contatore
function normDraft(res, bets) {
  const d = {};
  for (const k in (res || {})) if (res[k] && bets[k] !== 'M') d[k] = { k: 'N', n: rDelta(1, res[k]) };

}
const SHORTCUTS = [['W', 'Vinto tutti', 1, 'win'], ['L', 'Perso tutti', -1, 'lose'], ['D', 'Double da mazzo', -2, 'lose'], ['T', 'Triple da mazzo', -3, 'lose']];

  nd.forEach(i => { if (!w.draft[i] || w.draft[i].k !== 'N') w.draft[i] = { k: 'N', n: w.draft[i] ? rDelta(1, w.draft[i]) : 0 }; });

      return `<div class="prow ${n > 0 ? 'won' : n < 0 ? 'lost' : ''}" id="rr${i}">
        <span class="pnm"><span class="pe2">${esc(G.players[i].emoji)}</span><span><b>${esc(G.players[i].name)}</b><small>puntata ${b}</small></span></span>

        <span class="cnt big"><button class="btn" onclick="setCnt(${i},-1)">−</button><span class="cv"><b class="${sgn(n)}">${fmt(n)}</b></span><button class="btn" onclick="setCnt(${i},1)">+</button></span>

    ${dealerRow}

    <div class="row">${!w.ret ? `<button class="btn sm ghost" onclick="G.w={mode:'wait',idx:G.w.idx};commit()">◀ Torna alle puntate</button>` : ''}${cancelBtn()}</div>`;
}
function setCnt(i, d) { const r = G.w.draft[i]; r.n = Math.max(-39, Math.min(39, (r.n || 0) + d)); commit(); }
function allN(key, n) { const w = G.w; nonDealers(G.hands[w.idx]).forEach(i => w.draft[i] = { k: 'N', n }); w.sc = key; commit(); }

/* --- 4. dopo la mano --- */
function afterSheet() {

function signSheet() {

  return `<h3>🃏 È uscita la matta!</h3>
    <p class="muted" style="margin:0">Si tira la riga: firma per confermare che i conti di questo mazzo sono giusti.</p>

let sigInk = false;
function initSig() {
  const c = $('#sig'); if (!c) return;
  const dpr = window.devicePixelRatio || 1, r = c.getBoundingClientRect();
  c.width = r.width * dpr; c.height = r.height * dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr); x.lineWidth = 2.6; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#f4f1ea';
  sigInk = false; let drawing = false;
  const pt = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { drawing = true; c.setPointerCapture(e.pointerId); const [a, b] = pt(e); x.beginPath(); x.moveTo(a, b); x.lineTo(a + .1, b + .1); x.stroke(); sigInk = true; };
  c.onpointermove = e => { if (!drawing) return; const [a, b] = pt(e); x.lineTo(a, b); x.stroke(); };
  c.onpointerup = c.onpointercancel = () => drawing = false;
}

  const c = $('#sig'), out = document.createElement('canvas');
  out.width = 300; out.height = Math.round(300 * c.height / c.width);

  G.cuts[G.w.idx] = { signer: G.players[si].name, sig: out.toDataURL('image/png'), t: Date.now() };

}

function giocEdit(idx, what) {

function delHandAt(idx) {
  if (G.w.ret) return toast('Finisci prima la modifica in corso');
  confirmModal(`Eliminare la mano ${idx + 1}?`, 'Puntate e risultati di questa mano vengono tolti dalla sessione. Non si può annullare.', '🗑 Elimina mano', () => {
    G.hands.splice(idx, 1);
    const nc = {};
    Object.entries(G.cuts).forEach(([k, c]) => { let n = +k; if (n === idx) n = idx - 1; else if (n > idx) n--; if (n >= 0 && !nc[n]) nc[n] = c; });
    G.cuts = nc;
    if (G.w.idx > idx) G.w.idx--;
    else if (G.w.idx === idx) {   // era l'ultima mano chiusa
      const last = G.hands.length - 1;
      if (last < 0) { G.hands = [{ bets: {}, res: {}, stage: 'bets' }]; G.w = { mode: 'bets', idx: 0, i: 0, draft: {} }; }
      else if (G.cuts[last]) { G.hands.push({ bets: {}, res: {}, stage: 'bets' }); G.w = { mode: 'bets', idx: last + 1, i: 0, draft: {} }; }
      else G.w = { mode: 'after', idx: last };
    }

/* --- modifica mani passate --- */
function handMenu(idx) {
  const h = G.hands[idx], w = G.w;
  if (w.ret) return toast('Finisci prima la modifica in corso');
  if (w.idx === idx && ['bets', 'res', 'sign'].includes(w.mode)) return;
  const isLast = idx === G.hands.length - 1;
  modal(`<h3>Mano ${idx + 1}</h3>
    ${h.stage !== 'bets' ? `<button class="btn" onclick="closeModal();editHandBets(${idx})">✏️ Modifica puntate</button>` : ''}
    ${h.stage === 'done' ? `<button class="btn" onclick="closeModal();editHandRes(${idx})">✏️ Modifica risultati</button>` : ''}

    <button class="btn ghost" onclick="closeModal()">Chiudi</button>`);
}
function editHandBets(idx, pi) {
  const h = G.hands[idx], ret = G.w.mode === 'wait' && G.w.idx === idx ? null : { ...G.w };
  G.w = { mode: 'bets', idx, i: pi ?? 0, draft: { ...h.bets }, review: pi == null, single: pi != null, ret };
  commit();
}
function editHandRes(idx, pi) {
  const k = pi == null ? 0 : nonDealers(G.hands[idx]).indexOf(pi);
  G.w = { mode: 'res', idx, draft: normDraft(G.hands[idx].res, G.hands[idx].bets), ret: { ...G.w } };
  commit();
  if (pi != null) setTimeout(() => flashRow(pi), 50);
}
// tocco su una casella della tabella: apre puntata o risultato di quel giocatore
function toggleSheet() { S.sheetMin = !S.sheetMin; render(); }
function cellTap(idx, i) {
  S.sheetMin = false;
  const w = G.w, h = G.hands[idx];
  if (w.mode === 'sign') return toast('Prima firma il mazzo o torna indietro');
  if (w.idx === idx && w.mode === 'bets') {
    if (w.review) return editBet(i);
    if (i === w.i && !w.single) return;
    if (w.back == null && !w.single) w.back = w.i;
    Object.assign(w, { i, single: true }); return commit();
  }
  if (w.idx === idx && w.mode === 'res') {
    if (h.bets[i] === 'M') return toast('È il mazziere: il suo conto si fa da solo');
    w.rv = false; commit(); return setTimeout(() => flashRow(i), 50);
  }
  if (w.ret) return toast('Finisci prima la modifica in corso');
  if (h.stage === 'bets') return;
  if (h.stage === 'play') return editHandBets(idx, i);
  const b = h.bets[i], r = h.res[i];
  modal(`<h3>Mano ${idx + 1} · ${pn(i)}</h3>
    <button class="btn" onclick="closeModal();editHandBets(${idx},${i})">🎯 Modifica la puntata<small>ora: ${b === 'M' ? 'mazziere' : b}</small></button>
    ${b !== 'M' ? `<button class="btn" onclick="closeModal();editHandRes(${idx},${i})">📋 Modifica il risultato<small>ora: ${rLabel(r)} → ${fmt(rDelta(b, r))}</small></button>` : ''}

}
function flashRow(i) {
  const el = document.getElementById('rr' + i); if (!el) return;
  el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function headTap(i) {
  const w = G.w;
  if (w.mode === 'bets' || w.mode === 'res') cellTap(w.idx, i);
}
function resetHand(idx) {
  confirmModal(`Cancellare la mano ${idx + 1}?`, 'Puntate e risultati di questa mano vengono cancellati e la rifai da capo.', 'Cancella', () => {
    G.hands[idx] = { bets: {}, res: {}, stage: 'bets' }; delete G.cuts[idx];

}

function askEnd() {
  const done = G.hands.filter(h => h.stage === 'done').length;
  const inc = G.hands.some((h, idx) => h.stage !== 'done' && (h.stage !== 'bets' || (G.w.idx === idx && Object.values(G.w.draft || {}).some(v => v !== 'M'))));
  if (!done) {
    confirmModal('FINE SESSIONE?', 'Non c’è ancora nessuna mano finita: la partita viene chiusa senza salvare niente.', 'Chiudi la partita', () => { G = null; LS.del('sem_game'); goHome(); });
    return;
  }
  const P = G.players, tot = totals(), sum = tot.reduce((a, b) => a + b, 0), fism = G.type === 'fism';
  const rk = {}; ranking().forEach(r => rk[r.id] = r.score);
  const order = P.map((p, i) => ({ p, i, t: tot[i] })).sort((a, b) => b.t - a.t);
  // totali per mazzo (tra una matta e l'altra)
  const mazzi = []; let cur = P.map(() => 0), has = false;
  G.hands.forEach((h, idx) => {
    if (h.stage === 'done') { P.forEach((_, i) => cur[i] += pDelta(h, i)); has = true; }
    if (G.cuts[idx]) { mazzi.push({ t: cur, firma: G.cuts[idx].signer }); cur = P.map(() => 0); has = false; }
  });

  modal(`<h3>🏁 Risultati della sessione</h3>

    ${mazzi.length > 1 ? `<div style="overflow-x:auto"><table class="mz"><tr><th></th>${P.map(p => `<th>${esc(p.emoji)}</th>`).join('')}</tr>

}

function startMsg() { S.msg = { text: S.msg?.text || '' }; S.view = 'msg'; render(); }

    <textarea id="msgTxt" placeholder="Kiuppa 🍑 +320&#10;Capitano 👨‍✈️ -480&#10;Giugi 🏳️ -70&#10;…" oninput="S.msg.text=this.value">${esc(S.msg.text)}</textarea>

    <button class="btn primary big" onclick="checkMsg()">Controlla ▶</button>
  </div></div>`;

async function pasteMsg() {
  try { const t = await navigator.clipboard.readText(); if (t) { S.msg.text = t; render(); } else toast('Gli appunti sono vuoti'); }
  catch (e) { toast('Tieni premuto nel riquadro e scegli Incolla'); }
}
function parseMsg(txt) {
  const g = allPlayers(), rows = [], bad = [], seen = {};
  for (let line of txt.split(/\r?\n/)) {
    line = line.replace(/^\s*\[[^\]]*\]\s*[^:]{1,40}:\s*/, '').replace(/\*/g, '').replace(/^\s*\d+[.)]\s+/, '').trim();
    if (!line) continue;
    const m = line.match(/^(.*?)([+\-−–]?)\s*(\d+)\s*$/);
    if (!m || !/\p{L}/u.test(m[1])) { if (/\p{L}/u.test(line)) bad.push(line); continue; }
    const label = m[1].replace(/[🥇🥈🥉]/gu, '').trim();
    const name = label.replace(/[^\p{L}\p{N}\s'.]/gu, '').replace(/\s+/g, ' ').trim();
    const emoji = label.replace(/[\p{L}\p{N}\s'.]/gu, '').trim();
    const id = slug(name);
    const score = parseInt(m[3], 10) * (/[\-−–]/.test(m[2]) ? -1 : 1);
    if (seen[id]) { bad.push(line + '  ← nome ripetuto'); continue; }
    seen[id] = true;
    rows.push({ id, name: g[id]?.name || name, emoji: g[id]?.emoji || emoji || '🃏', isNew: !g[id], score });
  }
  return { rows, bad };
}
function checkMsg() {
  const txt = ($('#msgTxt')?.value ?? S.msg.text); S.msg.text = txt;
  const { rows, bad } = parseMsg(txt);
  if (!rows.length) return toast('Non trovo righe tipo "Nome emoji +punti"');
  const cur = {}; ranking().forEach(r => cur[r.id] = r);
  const inMsg = new Set(rows.map(r => r.id));
  const missing = Object.values(cur).filter(r => !inMsg.has(r.id));
  const changes = rows.map(r => ({ ...r, old: cur[r.id]?.score ?? 0 })).filter(r => r.isNew || r.score !== r.old);
  const finalSum = rows.reduce((a, r) => a + r.score, 0) + missing.reduce((a, r) => a + r.score, 0);
  S.msg.pending = { changes };
  const okSum = finalSum === 0;
  modal(`<h3>📋 Controllo del messaggio</h3>
    <p>${rows.length} giocatori letti · ${changes.length ? `<b>${changes.length}</b> da aggiornare` : 'nessuna differenza'}</p>
    ${changes.length ? `<ol class="rank">${changes.map(c => `<li><span class="em">${esc(c.emoji)}</span><span class="nm">${esc(c.name)}${c.isNew ? ' <small class="muted">(nuovo)</small>' : ''}<span class="sub">${fmt(c.old)} →</span></span><span class="sc ${sgn(c.score)}">${fmt(c.score)}</span></li>`).join('')}</ol>` : `<div class="ok">La classifica nel database è già uguale al messaggio ✓</div>`}
    ${missing.length ? `<div class="warn">Non sono nel messaggio e restano come sono: ${missing.map(r => `${esc(r.emoji)} ${esc(r.name)} ${fmt(r.score)}`).join(', ')}</div>` : ''}
    ${bad.length ? `<div class="warn">Righe che non ho capito (ignorate):<br>${bad.map(esc).join('<br>')}</div>` : ''}

const dstr = d => { try { return new Date(d).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
// Firebase trasforma {"0":..,"1":..} in array: lo riporto a oggetto
function norm(o) { if (Array.isArray(o)) { const r = {}; o.forEach((v, i) => { if (v != null) r[i] = v; }); return r; } return o || {}; }
function packTable() {
  const cuts = {}; Object.entries(G.cuts || {}).forEach(([k, c]) => { if (c) cuts[k] = { signer: c.signer }; });
  return { players: G.players.map(({ id, name, emoji }) => ({ id, name, emoji })),
           hands: G.hands.filter(h => h.stage === 'done').map(h => ({ bets: h.bets, res: h.res })), cuts };
}
function allSessions() {

}

/* ===== GRAFICO, GASOMETRO E PAGAMENTO DI FINE MESE ===== */
const SERIES = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'];
const today = () => window.__oggi ? new Date(window.__oggi) : new Date();
const meseNome = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleString('it-IT', { month: 'long', year: 'numeric' }); };
const isGame = r => !r.fonte || r.fonte === 'foglio';
// gasometro: differenza tra chi ha vinto di più e chi ha perso di più
function gasOf(r) { const v = Object.values(r.deltas || {}).map(Number); return v.length ? Math.max(...v) - Math.min(...v) : 0; }
function gasLevel(g) {
  if (g < 450) return ['😴 Moscia', '#8a8780'];
  if (g < 1200) return ['🙂 Tranquilla', '#c98500'];
  if (g < 2000) return ['🔥 Gasata', '#d95926'];
  if (g < 3000) return ['🚀 Gasatissima', '#e0442f'];
  return ['💥 GAS AL MASSIMO', '#ff2d1a'];
}
function gasMax() { return 3000; }   // gas al massimo = 3000 di differenza tra primo e ultimo della partita
function miniGas(r) {
  const g = gasOf(r), [lab, col] = gasLevel(g), pct = Math.min(100, g / gasMax() * 100);
  return `<div class="mgas">⛽<span class="bar"><i style="width:${pct}%;background:${col}"></i></span><span>${lab} · ${g}</span></div>`;
}
function gaugeSVG(g) {
  const max = gasMax(), [lab, col] = gasLevel(g), f = Math.min(1, g / max);
  const cx = 150, cy = 140, R = 110, pt = a => [cx - R * Math.cos(a), cy - R * Math.sin(a)];
  const arc = (a0, a1, c) => { const [x0, y0] = pt(a0), [x1, y1] = pt(a1); return `<path d="M${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1}" stroke="${c}" stroke-width="18" fill="none"/>`; };
  const zones = [[0, 450, '#5a5853'], [450, 1200, '#c98500'], [1200, 2000, '#d95926'], [2000, max, '#e0442f']]
    .filter(([a]) => a < max).map(([a, b, c]) => arc(Math.PI * a / max + .01, Math.PI * Math.min(b, max) / max - .01, c)).join('');
  return `<svg viewBox="0 0 300 160" role="img" aria-label="Gasometro: ${lab}, ${g} punti di differenza">
    ${zones}
    <g class="needle" data-a="${(f * 180).toFixed(1)}" style="transform-origin:${cx}px ${cy}px;transform:rotate(0deg);transition:transform 1.6s cubic-bezier(.2,1.4,.4,1)">
      <line x1="${cx}" y1="${cy}" x2="${cx - R + 22}" y2="${cy}" stroke="#f4f1ea" stroke-width="4" stroke-linecap="round"/></g>
    <circle cx="${cx}" cy="${cy}" r="9" fill="#f4f1ea"/>
    <text x="${cx - R}" y="${cy + 18}" fill="#9a968e" font-size="12" text-anchor="middle">0</text>
    <text x="${cx + R}" y="${cy + 18}" fill="#9a968e" font-size="12" text-anchor="middle">${max}+</text>
  </svg><div class="gl" style="color:${col}">${lab}</div><div class="gs">⛽ ${g} punti tra chi ha vinto di più e chi ha perso di più</div>`;
}
function animGauge() { document.querySelectorAll('.needle').forEach(n => requestAnimationFrame(() => n.style.transform = `rotate(${n.dataset.a}deg)`)); }

// --- pagamento di fine mese: l'ultimo paga il primo ---

  if (key < '2026-11') return null;

}

// --- grafico della singola partita ---
function openGraf(id, back) { S.gid = id; S.gback = back; S.view = 'graf'; render(); }
function grafBack() { S.view = S.gback || 'hist'; render(); }
function gameSeries(id) {
  const g = allPlayers();
  // partita aperta in modifica: uso i dati attuali (anche non salvati)
  let players, hands, cuts = {}, r = allSessions().find(x => x.id === id);
  if (G && G.editOf === id) { players = G.players; hands = G.hands.filter(h => h.stage === 'done'); cuts = G.cuts || {}; r = { ...r, deltas: Object.fromEntries(G.players.map((p, i) => [p.id, totals()[i]])) }; }
  else if (r && r.tabella && r.tabella.hands) { players = r.tabella.players || []; hands = r.tabella.hands.map(h => ({ bets: norm(h.bets), res: norm(h.res) })); cuts = norm(r.tabella.cuts); }
  if (!r) return null;
  if (players && hands) {
    const hd = (h, i) => {
      if (h.bets[i] === 'M') { let s = 0; players.forEach((_, j) => { if (j !== i && h.bets[j] !== 'M') s += rDelta(h.bets[j], h.res[j]); }); return -s; }
      return rDelta(h.bets[i], h.res[i]);
    };
    const pts = {}, labels = ['Inizio', ...hands.map((_, k) => String(k + 1))];
    players.forEach((p, i) => { let c = 0; pts[p.id] = [0, ...hands.map(h => (c += hd(h, i)))]; });
    const cutsAt = Object.keys(cuts).map(Number).filter(k => k < hands.length).map(k => k + 1);
    return { r, ids: players.map(p => p.id), pts, labels, cutsAt, names: Object.fromEntries(players.map(p => [p.id, p])), xname: 'mano' };
  }
  // senza tabella: solo inizio → fine
  const ids = Object.keys(r.deltas || {}), pts = {};
  ids.forEach(id2 => pts[id2] = [0, +r.deltas[id2] || 0]);
  return { r, ids, pts, labels: ['Inizio', 'Fine'], cutsAt: [], names: Object.fromEntries(ids.map(x => [x, g[x] || { name: x, emoji: '🃏' }])), xname: '' };
}
function grafHTML() {
  const D = gameSeries(S.gid);
  if (!D) return `<header class="top"><button class="btn sm ghost" onclick="grafBack()">←</button><div class="title">📈 Grafico</div></header><div class="scroll"><div class="home"><p class="muted">Partita non trovata.</p></div></div>`;
  const { r, ids, pts, labels, cutsAt, names } = D;
  const fin = id => pts[id][pts[id].length - 1];
  const color = {}; ids.forEach((id, k) => color[id] = SERIES[k % SERIES.length]);
  const sel = S.gsel && S.gsel.filter(x => ids.includes(x)).length ? S.gsel.filter(x => ids.includes(x)) : ids;
  const cw = Math.min(700, Math.max(300, ((window.innerWidth || 390) >= 900 ? (window.innerWidth - 40) * .62 : (window.innerWidth || 390) - 40)));
  const W = Math.round(cw), H = Math.round(W * .62), L = 44, Rm = 32, T = 12, B = 26, N = labels.length - 1;
  const all = ids.flatMap(id => pts[id]); let lo = Math.min(0, ...all), hi = Math.max(0, ...all);
  const st = niceStep(hi - lo || 100); lo = Math.floor(lo / st) * st; hi = Math.ceil(hi / st) * st; if (hi === lo) hi = lo + st;
  const X = i => L + (W - L - Rm) * i / N, Y = v => T + (H - T - B) * (hi - v) / (hi - lo);
  let grid = '';
  for (let v = lo; v <= hi + 1e-9; v += st) grid += `<line x1="${L}" x2="${W - Rm}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v === 0 ? '#8a8780' : '#2e2e2c'}" stroke-width="${v === 0 ? 1.5 : 1}"/><text x="${L - 6}" y="${Y(v) + 4}" fill="#9a968e" font-size="11" text-anchor="end">${v > 0 ? '+' : ''}${v}</text>`;
  cutsAt.forEach(k => grid += `<line x1="${X(k)}" x2="${X(k)}" y1="${T}" y2="${H - B}" stroke="#f4f1ea" stroke-width="1" stroke-dasharray="3 4" opacity=".35"/><text x="${X(k)}" y="${T + 10}" fill="#9a968e" font-size="10" text-anchor="middle">🃏</text>`);
  const every = Math.max(1, Math.ceil(N / 8));
  labels.forEach((lb, i) => { if (i % every === 0 || i === N) grid += `<text x="${X(i)}" y="${H - 9}" fill="#9a968e" font-size="11" text-anchor="middle">${esc(lb)}</text>`; });
  const path = arr => arr.map((v, i) => i === 0 ? `M${X(0)} ${Y(v)}` : `C${(X(i - 1) + X(i)) / 2} ${Y(arr[i - 1])} ${(X(i - 1) + X(i)) / 2} ${Y(v)} ${X(i)} ${Y(v)}`).join(' ');
  const lines = ids.map(id => sel.includes(id)
    ? `<path class="ln" d="${path(pts[id])}" stroke="${color[id]}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`
    : `<path class="ln" d="${path(pts[id])}" stroke="#4a4a47" stroke-width="1.5" fill="none" stroke-linecap="round"/>`).join('');
  const ends = ids.filter(id => sel.includes(id)).map(id => `<g class="end"><circle cx="${X(N)}" cy="${Y(fin(id))}" r="5" fill="${color[id]}" stroke="#1a1a19" stroke-width="2"/><text x="${X(N) + 9}" y="${Y(fin(id)) + 5}" font-size="14">${esc(names[id]?.emoji || '')}</text></g>`).join('');
  const svg = `<svg id="gsvg" viewBox="0 0 ${W} ${H}" data-n="${N}" data-l="${L}" data-w="${W - L - Rm}" role="img" aria-label="Andamento della partita">${grid}${lines}${ends}<line id="gcross" y1="${T}" y2="${H - B}" stroke="#f4f1ea" stroke-width="1" opacity="0"/></svg>`;
  S.gdata = { labels: labels.map((l, i) => i === 0 ? 'Inizio' : D.xname ? `Mano ${l}` : l), pts, sel: ids.filter(id => sel.includes(id)), color, g: names };
  return `<header class="top"><button class="btn sm ghost" onclick="grafBack()">←</button><div class="title">📈 ${esc(sessLabel(r))}<small>${esc(dstr(r.date))}</small></div></header>
  <div class="scroll"><div class="home" style="max-width:1100px">
    <div class="grafwrap">
      <div class="grafchart">
        <div class="chartbox">${svg}<div class="tip" id="gtip"></div></div>
        <div class="row" style="justify-content:space-between;margin:0"><span class="muted" style="font-size:12px">Tocca il grafico per i punteggi · tocca un nome per metterlo in evidenza${cutsAt.length ? ' · 🃏 = matta' : ''}</span><button class="btn sm" onclick="render()">▶ Rivedi</button></div>
        <div class="lgd">${ids.slice().sort((a, b) => fin(b) - fin(a)).map(id => `<button class="${sel.includes(id) ? '' : 'off'}" onclick="toggleG('${esc(id)}')"><i style="background:${color[id]}"></i>${esc(names[id]?.emoji || '')} ${esc(names[id]?.name || id)} <b>${fmt(fin(id))}</b></button>`).join('')}</div>
      </div>
      <div class="grafgas"><h3 style="margin:0 0 6px">⛽ Gasometro</h3><div class="gasbox" style="margin-top:0">${gaugeSVG(gasOf(r))}</div></div>
    </div>
  </div></div>`;
}
function toggleG(id) {
  const ids = gameSeries(S.gid)?.ids || [];
  let s = S.gsel && S.gsel.filter(x => ids.includes(x)).length ? S.gsel.filter(x => ids.includes(x)) : ids.slice();
  if (s.length === ids.length) s = [id];                 // primo tocco: evidenzia solo lui
  else if (s.includes(id)) s = s.filter(x => x !== id);
  else s = [...s, id];
  S.gsel = s.length ? s : ids.slice();
  render();
}
function niceStep(range) { const raw = range / 4, p = Math.pow(10, Math.floor(Math.log10(raw || 1))), n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function afterGraf() {
  animGauge();
  const svg = $('#gsvg'); if (!svg) return;
  svg.querySelectorAll('.ln').forEach(p => {
    const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    p.getBoundingClientRect(); p.style.transition = 'stroke-dashoffset 2.2s ease-in-out'; p.style.strokeDashoffset = 0;
  });
  svg.querySelectorAll('.end').forEach(e => { e.style.opacity = 0; e.style.transition = 'opacity .5s 2s'; requestAnimationFrame(() => e.style.opacity = 1); });
  const tip = $('#gtip'), cross = $('#gcross'), D = S.gdata;
  const show = ev => {
    const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, x = (ev.clientX - r.left) * vb.width / r.width;
    const n = +svg.dataset.n, l = +svg.dataset.l, w = +svg.dataset.w, i = Math.max(0, Math.min(n, Math.round((x - l) / w * n)));
    const cx = l + w * i / n; cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('opacity', .5);
    const rows = D.sel.map(id => ({ id, v: D.pts[id][i] })).sort((a, b) => b.v - a.v);
    tip.innerHTML = `<div class="muted">${esc(D.labels[i])}</div>` + rows.map(o => `<div><span style="color:${D.color[o.id]}">●</span> ${esc(D.g[o.id]?.emoji || '')} ${esc(D.g[o.id]?.name || o.id)} <b>${fmt(o.v)}</b></div>`).join('');
    tip.style.display = 'block';
    const px = cx * r.width / vb.width; tip.style.left = (px > r.width / 2 ? px - tip.offsetWidth - 10 : px + 10) + 'px';
  };
  svg.addEventListener('pointerdown', show); svg.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) show(e); });
  svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; cross.setAttribute('opacity', 0); });
}

/* ---------- schermo sempre acceso durante la partita ---------- */
let wl = null;
async function wake() { try { if ('wakeLock' in navigator && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => wl = null); } } catch (e) {} }

window.addEventListener('online', () => flushPending().then(render));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wl = null; if (S.view === 'game') wake(); if (S.view === 'home') loadReg(); } });

render();
loadReg();
</script>
</body>
</html>
